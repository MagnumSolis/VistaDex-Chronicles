# .github/workflows/graveyard-sync.yml — automated graveyard growth.
# On schedule (and on demand): key-free smoke test, then discovery (TinyFish search
# → graveyard_signals → LLM extraction → staging candidates), then the Death Watcher
# (a candidate is confirmed only with 2 fetched pages on distinct domains that name
# the company and state its death), then export confirmed entries and commit+deploy
# the snapshot. Nothing is published without 2 good sources. Each run's numbers
# (queries, signals, pre-filtered, extracted, new candidates, sources added,
# confirmed) go to fleet_state {_id: "metrics"} and the job summary.
#
# Per-run limits (repo variables, defaults below) keep each run inside free tiers:
#   DISCOVERY_QUERIES 4 TinyFish searches · SIGNAL_LIMIT 30 LLM calls (~2.5k tokens
#   each), EXTRACT_DELAY_MS 10 s apart, stopping after EXTRACT_BUDGET_MS 20 min.
#   Extraction calls Mistral small first (free tier ~1 request/s) and Groq on failure
#   (gpt-oss-120b free tier: 8k tokens/min, 200k/day; re-check if GROQ_MODEL changes).
#   If both refuse, the run stops cleanly and the rest wait for the next run.
#   Search hits that name no company are skipped before the LLM and do not count
#   towards SIGNAL_LIMIT; the backlog drains oldest first.
#   WATCHER_LIMIT candidates, ~3 TinyFish calls each.
# Secrets: MONGODB_URI, TINYFISH_API_KEY, GROQ_API_KEY and/or MISTRAL_API_KEY
# (without an LLM key extraction skips and signals wait), CLOUDFLARE_*.

name: graveyard-sync

on:
  schedule:
    - cron: "17 */2 * * *" # every 2 hours during the launch push (was */6); repo vars set the per-run limits
  workflow_dispatch: {} # manual run from the Actions tab

permissions:
  contents: write # needed to push the snapshot commit

concurrency:
  group: graveyard-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install backend deps
        working-directory: backend
        run: npm install

      - name: Smoke test (key-free)
        working-directory: backend
        run: npm run smoke

      - name: "Discovery: search, store signals, extract candidates"
        working-directory: backend
        continue-on-error: true # a failed discovery must not block confirming or exporting
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          TINYFISH_API_KEY: ${{ secrets.TINYFISH_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          DISCOVERY_QUERIES: ${{ vars.DISCOVERY_QUERIES || '4' }}
          SIGNAL_LIMIT: ${{ vars.SIGNAL_LIMIT || '30' }}
          EXTRACT_DELAY_MS: ${{ vars.EXTRACT_DELAY_MS || '10000' }}
          EXTRACT_BUDGET_MS: ${{ vars.EXTRACT_BUDGET_MS || '1200000' }}
          FLEET_MODE: discovery
        run: node src/tinyfish-fleet.js

      - name: "Death Watcher: confirm candidates with 2 good sources"
        working-directory: backend
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          TINYFISH_API_KEY: ${{ secrets.TINYFISH_API_KEY }}
          WATCHER_LIMIT: ${{ vars.WATCHER_LIMIT || '50' }}
          FLEET_MODE: watcher
        run: node src/tinyfish-fleet.js

      - name: Export confirmed → snapshot
        working-directory: backend
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: npm run db:export

      - name: Stats
        working-directory: backend
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: npm run db:stats

      - name: "Run report: queries, signals, pre-filtered, extracted, new candidates, sources added, confirmed"
        if: always()
        working-directory: backend
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: node src/fleet-report.js

      - name: Commit + push snapshot (if changed)
        id: snapshot
        run: |
          git config user.name "vistadex-bot"
          git config user.email "actions@github.com"
          git add worker/data/graveyard.json
          if git diff --cached --quiet; then
            echo "No new confirmed entries — nothing to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: graveyard auto-sync ($(date -u +%Y-%m-%dT%H:%MZ)) [skip graveyard-sync]"
            # Integrate any commits pushed to the branch this run checked out
            # (main on schedule; the chosen ref on a manual run) while it was in
            # flight, then push. Rebasing onto main from another branch fails in
            # this shallow checkout. Rebase keeps our snapshot commit on top.
            git pull --rebase --autostash origin "$GITHUB_REF_NAME"
            if git push; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "Push failed even after rebase — leaving snapshot uncommitted-to-remote; next run will retry." >&2
              echo "changed=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      # NOTE: pushes made with GITHUB_TOKEN do NOT trigger other workflows
      # (GitHub recursion prevention) — so this workflow deploys directly.
      - name: Deploy Worker with the new snapshot
        if: steps.snapshot.outputs.changed == 'true'
        run: npx wrangler@4 deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
