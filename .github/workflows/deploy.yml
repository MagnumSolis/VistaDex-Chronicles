# .github/workflows/deploy.yml — deploy the vistadex-proxy Worker whenever its
# code or the graveyard snapshot changes on main. (The site is deployed
# separately via `wrangler pages deploy web/dist` from the dev machine; the
# graveyard-sync workflow deploys the proxy itself after each snapshot push.)
name: deploy

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "prototype/**"
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deploy proxy Worker
        run: npx wrangler@4 deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
